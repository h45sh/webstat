[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webstat"
version = "0.1.3"
description = "Fast website status checker, recovery watcher, and desktop reminder"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "h45sh" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["website", "uptime", "status", "monitoring", "cli", "desktop-widget", "omarchy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/h45sh/webstat"
Repository = "https://github.com/h45sh/webstat"
Issues = "https://github.com/h45sh/webstat/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
webstat = "webstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
